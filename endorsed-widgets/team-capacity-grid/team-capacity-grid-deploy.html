<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Team Capacity Grid</title>
  <style>
* {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-size: 14px;
}

body {
    color: #434a54;
    margin: 0;
    padding: 8px;
}

.tcg-header {
    align-items: center;
    display: flex;
    gap: 16px;
    justify-content: space-between;
    margin-bottom: 8px;
}

.tcg-instructions {
    color: #58606e;
    font-size: 12px;
    margin: 0;
}

.tcg-button {
    background-color: #fff;
    border: 1px solid #1d5bbf;
    border-radius: 3px;
    color: #1d5bbf;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    height: 28px;
    padding: 3px 12px;
}

.tcg-button:hover:not(:disabled) {
    background-color: #f0f5fc;
}

.tcg-button:focus-visible,
.tcg-capacity-input:focus-visible {
    outline: 2px solid #3272d9;
    outline-offset: 1px;
}

.tcg-button:disabled {
    border-color: #c4c9d1;
    color: #6b7280;
    cursor: default;
}

.tcg-table {
    border-collapse: collapse;
    width: 100%;
}

.tcg-table th {
    background: #f5f6f7;
    border-bottom: 2px solid #c4c9d1;
    color: #58606e;
    font-size: 12px;
    font-weight: 600;
    padding: 8px 12px;
    text-align: left;
}

.tcg-table td {
    border-bottom: 1px solid #ebeff5;
    padding: 6px 12px;
    vertical-align: middle;
}

.tcg-table tr:hover td {
    background: #f9fafb;
}

.tcg-col-number {
    width: 15%;
}

.tcg-col-load {
    width: 30%;
}

.tcg-capacity-input {
    border: 1px solid #c4c9d1;
    border-radius: 3px;
    height: 28px;
    padding: 2px 6px;
    width: 80px;
}

.tcg-capacity-input.is-invalid {
    border-color: #c62828;
}

.tcg-load {
    align-items: center;
    display: flex;
    gap: 8px;
}

.tcg-load-track {
    background: #ebeff5;
    border-radius: 3px;
    flex: 1;
    height: 16px;
    overflow: hidden;
}

.tcg-load-fill {
    height: 100%;
}

.tcg-load-fill.is-low {
    background: #b2e3b6;
}

.tcg-load-fill.is-medium {
    background: #fbde98;
}

.tcg-load-fill.is-high {
    background: #fcb5b1;
}

.tcg-load-label {
    min-width: 40px;
    text-align: right;
}

#wrapper {
    display: flex;
    flex-direction: column;
    min-height: calc(100vh - 16px);
}

#tcg-grid {
    flex: 1;
}

.tcg-footer {
    align-items: center;
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: auto;
    padding-top: 8px;
}

.tcg-range {
    color: #58606e;
    font-size: 12px;
}

.tcg-status {
    color: #c62828;
    font-size: 12px;
    min-height: 16px;
    margin: 4px 0;
}

.tcg-status.is-info {
    color: #58606e;
}

.tcg-visually-hidden {
    clip: rect(0 0 0 0);
    height: 1px;
    overflow: hidden;
    position: absolute;
    white-space: nowrap;
    width: 1px;
}

.tcg-message {
    background: #eef4fc;
    border: 1px solid #bcd4f3;
    border-radius: 3px;
    color: #434a54;
    padding: 12px;
}

.tcg-message.is-error {
    background: #fdecea;
    border-color: #f5b5b0;
}

.tcg-sort {
    background: none;
    border: 0;
    color: inherit;
    cursor: pointer;
    font: inherit;
    padding: 0;
}

.tcg-sort:hover:not(:disabled) {
    color: #1d5bbf;
}

.tcg-sort:focus-visible {
    outline: 2px solid #3272d9;
    outline-offset: 2px;
}

th[aria-sort="ascending"] .tcg-sort::after {
    content: " \25B2";
    font-size: 9px;
}

th[aria-sort="descending"] .tcg-sort::after {
    content: " \25BC";
    font-size: 9px;
}


</style>
</head>

    const ariaSort = isSorted ? ` aria-sort="${sort.isDescending ? "descending" : "ascending"}"` : "";
    return `<th scope="col" class="${className}"${ariaSort}><button type="button" class="tcg-sort" id="${getSortButtonId(field)}" data-field="${field}">${label}</button></th>`;
  };
  var onSortClick = (field) => {
    sort = { field, isDescending: sort.field === field && !sort.isDescending };
    startIndex = 1;
    loadPage();
  };
  var loadPage = async () => {
    const requestId = ++loadRequestId;
    const iterationQuery = getIterationQuery();
    if (!iterationQuery) {
      renderMessage("You must specify a valid Iteration/Sprint. Unscheduled is not supported.");
      return;
    }
    if (!document.getElementById("tcg-grid")) {
      renderGridShell();
    }
    const grid = document.getElementById("tcg-grid");
    const focusedControlId = document.activeElement && document.activeElement.id;
    grid.setAttribute("aria-busy", "true");
    setControlsDisabled(true);
    setStatus("Loading...", true);
    const params = {
      workspace: $RallyContext.GlobalScope.Workspace._ref,
      project: $RallyContext.GlobalScope.Project._ref,
      projectScopeUp: $RallyContext.GlobalScope.ProjectScopeUp,
      projectScopeDown: $RallyContext.GlobalScope.ProjectScopeDown,
      fetch: FETCH_FIELDS,
      query: encodeURIComponent(iterationQuery),
      order: encodeURIComponent(`${sort.field}${sort.isDescending ? " desc" : ""}`),
      pagesize: PAGE_SIZE,
      start: startIndex
    };
    try {
      const results = await loadWsapiData("useriterationcapacity", params, true);
      if (requestId !== loadRequestId) {
        return;
      }
      const queryResult = results && results.QueryResult;
      if (!queryResult || queryResult.Errors && queryResult.Errors.length > 0) {
        throw new Error(queryResult ? queryResult.Errors.join(", ") : "No response from Rally");
      }
      loadedStartIndex = startIndex;
      loadedSort = { ...sort };
      records = queryResult.Results;
      totalResultCount = queryResult.TotalResultCount;
      setStatus("");
      renderGrid();
      restoreFocus(focusedControlId);
    } catch (error) {
      if (requestId !== loadRequestId || isUnloading) {
        return;
      }
      console.error("Failed to load team capacity:", error);
      startIndex = loadedStartIndex;
      sort = { ...loadedSort };
      grid.setAttribute("aria-busy", "false");
      setStatus("Unable to load team capacity. Please try again.");
      setControlsDisabled(false);
      renderFooter();
      restoreFocus(focusedControlId);
    }
  };
  var getLoadClass = (load) => {
    if (load < LOW_LOAD_LIMIT) return "is-low";
    if (load < FULL_LOAD_LIMIT) return "is-medium";
    return "is-high";
  };
  var loadTemplate = (record) => {
    if (record.Load == null) {
      return '<span aria-hidden="true">&mdash;</span><span class="tcg-visually-hidden">No load</span>';
    }
    const percent = Math.round(record.Load * 100);
    const barWidth = Math.min(percent, 100);
    return `<div class="tcg-load">
    <div class="tcg-load-track" role="progressbar" aria-label="Load" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${barWidth}" aria-valuetext="${percent}%">
      <div class="tcg-load-fill ${getLoadClass(record.Load)}" style="width: ${barWidth}%"></div>
    </div>
    <span class="tcg-load-label">${percent}%</span>
  </div>`;
  };
  var createRow = (record, index) => {
    const userName = record.User ? record.User._refObjectName : "";
    const row = document.createElement("tr");
    row.dataset.index = index;
    const userCell = document.createElement("td");
    userCell.innerHTML = sanitizeRichHtml(userName);
    const userLabel = userCell.textContent;
    const input = document.createElement("input");
    input.type = "number";
    input.min = "0";
    input.step = "any";
    input.className = "tcg-capacity-input";
    input.value = record.Capacity == null ? "" : record.Capacity;
    input.setAttribute("aria-label", `Capacity for ${userLabel}`);
    input.addEventListener("change", onCapacityChange);
    const capacityCell = document.createElement("td");
    capacityCell.appendChild(input);
    const estimatesCell = document.createElement("td");
    estimatesCell.className = "tcg-task-estimates";
    estimatesCell.textContent = record.TaskEstimates == null ? "" : record.TaskEstimates;
    const loadCell = document.createElement("td");
    loadCell.className = "tcg-load-cell";
    loadCell.innerHTML = loadTemplate(record);
    row.append(userCell, capacityCell, estimatesCell, loadCell);
    return row;
  };
  var renderGrid = () => {
    const grid = document.getElementById("tcg-grid");
    if (records.length === 0) {
      grid.innerHTML = '<div class="tcg-message" role="status">There are no capacity records for this iteration.</div>';
    } else {
      grid.innerHTML = `<table class="tcg-table" aria-label="Team capacity">
      <thead>
        <tr>
          ${sortableHeaderTemplate("User", "User")}
          ${sortableHeaderTemplate("Capacity", "Capacity", "tcg-col-number")}
          <th scope="col" class="tcg-col-number">Task Estimates</th>
          <th scope="col" class="tcg-col-load">Load</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>`;
      grid.querySelector("tbody").append(...records.map(createRow));
      grid.querySelectorAll(".tcg-sort").forEach((button) => {
        button.addEventListener("click", () => onSortClick(button.dataset.field));
      });
    }
    grid.setAttribute("aria-busy", "false");
    renderFooter();
  };
  var renderFooter = () => {
    const footer = document.getElementById("tcg-footer");
    const firstShown = records.length === 0 ? 0 : startIndex;
    const lastShown = records.length === 0 ? 0 : startIndex + records.length - 1;
    const hasMultiplePages = totalResultCount > PAGE_SIZE;
    footer.innerHTML = `<span class="tcg-range" aria-live="polite">${firstShown}-${lastShown} of ${totalResultCount}</span>${hasMultiplePages ? `<button type="button" class="tcg-button" id="tcg-prev">Previous</button>
    <button type="button" class="tcg-button" id="tcg-next">Next</button>` : ""}`;
    setControlsDisabled(false);
    if (!hasMultiplePages) {
      return;
    }
    document.getElementById("tcg-prev").disabled = startIndex <= 1;
    document.getElementById("tcg-next").disabled = startIndex + PAGE_SIZE > totalResultCount;
    document.getElementById("tcg-prev").addEventListener("click", () => {
      startIndex = Math.max(1, startIndex - PAGE_SIZE);
      loadPage();
    });
    document.getElementById("tcg-next").addEventListener("click", () => {
      startIndex += PAGE_SIZE;
      loadPage();
    });
  };
  var onCapacityChange = async (event) => {
    const input = event.target;
    const row = input.closest("tr");
    const record = records[Number(row.dataset.index)];
    const previousCapacity = record.Capacity == null ? "" : String(record.Capacity);
    const rawValue = input.value.trim();
    const newCapacity = rawValue === "" ? null : Number(rawValue);
    if (input.validity.badInput || newCapacity !== null && (!Number.isFinite(newCapacity) || newCapacity < 0)) {
      input.classList.add("is-invalid");
      input.value = previousCapacity;
      setStatus("Capacity must be a number that is 0 or greater.");
      return;
    }
    input.classList.remove("is-invalid");
    setStatus("");
    input.readOnly = true;
    input.setAttribute("aria-busy", "true");
    try {
      await updateWsapiObject(record._ref, { Capacity: newCapacity }, getSecurityToken());
      record.Capacity = newCapacity;
    } catch (error) {
      console.error("Failed to save capacity:", error);
      input.value = previousCapacity;
      setStatus("Unable to save capacity. The previous value was restored.");
      input.readOnly = false;
      input.removeAttribute("aria-busy");
      return;
    }
    try {
      const updated = await fetchWsapiObject(record._ref, FETCH_FIELDS.split(","));
      if (!row.isConnected || records[Number(row.dataset.index)] !== record) {
        return;
      }
      records[Number(row.dataset.index)] = { ...record, ...updated, User: record.User };
      row.querySelector(".tcg-task-estimates").textContent = updated.TaskEstimates;
      row.querySelector(".tcg-load-cell").innerHTML = loadTemplate(updated);
      input.value = updated.Capacity == null ? "" : updated.Capacity;
    } catch (error) {
      console.error("Failed to refresh row after saving capacity:", error);
      setStatus("Capacity was saved, but the row could not be refreshed. Use Refresh to update Task Estimates and Load.");
    } finally {
      input.readOnly = false;
      input.removeAttribute("aria-busy");
    }
  };
  main();
})();
