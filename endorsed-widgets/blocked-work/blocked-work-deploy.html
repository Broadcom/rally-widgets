  <div class="itemViewerPaging"></div>
  <div class="itemViewerCollection"></div>
  <div class="itemViewerShowMore"></div>
  <script>

   console.log('$RallyContext',$RallyContext);
</script>
<script>
(() => {
  // utilities/ui-utilities.js
  function escapeHtml(text) {
    if (text == null) return "";
    const div = document.createElement("div");
    div.textContent = String(text);
    return div.innerHTML;
  }

  // blocked-work/widget.js
  var defaultSettings = {
    ignoreViewFilter: false
  };
  var allBlockedItems = [];
  var totalResultCount = 0;
  var isLoadingMore = false;
  var main = () => {
    window.addEventListener("message", (event) => {
      if (event.origin !== $RallyContext.Url.origin) {
        return;
      }
      if (event.data.type === "RALLY_CONTEXT_LOADED") {
        if ($RallyContext.isEditMode) {
          let userSettings = cleanseSettings($RallyContext.Settings);
          let mergedSettings = { ...defaultSettings, ...userSettings };
          window.RallyContext.updateSettings(mergedSettings);
          renderEditMode();
        } else {
          fetchItems();
        }
      }
    });
  };
  var cleanseSettings = (settings) => {
    let cleansedSettings = settings || {};
    if (typeof cleansedSettings.ignoreViewFilter !== "boolean") {
      cleansedSettings.ignoreViewFilter = false;
    }
    return cleansedSettings;
  };
  var renderEditMode = () => {
    const wrapper = document.body;
    const container = document.createElement("div");
    container.className = "edit-mode-container";
    container.style.cssText = 'padding: 16px; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;';
    const label = document.createElement("label");
    label.style.cssText = "display: flex; align-items: center; font-size: 14px; font-weight: 600; margin-bottom: 8px;";
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.id = "ignoreViewFilter";
    checkbox.checked = $RallyContext.Settings.ignoreViewFilter === true;
    checkbox.style.cssText = "margin-right: 8px; width: 18px; height: 18px; cursor: pointer;";
    const labelText = document.createElement("span");
    labelText.textContent = "Ignore View Filter";
    const helpText = document.createElement("div");
    helpText.style.cssText = "font-size: 11px; color: #58606e; margin-left: 26px; margin-top: 4px;";
    helpText.textContent = "When checked, all blocked items in the selected project scope are displayed regardless of view filter. When unchecked (default), only blocked items matching the current view filter (Iteration/Release) are shown.";
    label.appendChild(checkbox);
    label.appendChild(labelText);
    container.appendChild(label);
    container.appendChild(helpText);
    checkbox.addEventListener("change", (e) => {
      window.RallyContext.updateSettings({
        ignoreViewFilter: e.target.checked
      });
    });
    wrapper.innerHTML = "";
    wrapper.appendChild(container);
  };
  var fetchItems = async (startIndex) => {
    if (isLoadingMore) return;
    const scoping = `workspace=${$RallyContext.GlobalScope.Workspace._ref}&project=${$RallyContext.GlobalScope.Project._ref}&projectScopeUp=${$RallyContext.GlobalScope.ProjectScopeUp}&projectScopeDown=${$RallyContext.GlobalScope.ProjectScopeDown}`;
    const blockedFetchFields = `WorkProduct,Project,Name,Description,FormattedID,CreationDate,BlockedBy,BlockedReason,Disabled,ObjectID,EmailAddress,Iteration,Release,Milestones`;
    let blockedFetchUrl = `${$RallyContext.Url.origin}/slm/webservice/v2.x/blocker?${scoping}&fetch=${blockedFetchFields}&pagesize=200&order=CreationDate%20DESC`;
    const settings = $RallyContext.Settings || defaultSettings;
    const shouldApplyFilter = !settings.ignoreViewFilter && $RallyContext.ViewFilter && $RallyContext.ViewFilter.Type && $RallyContext.ViewFilter.Value;
    if (shouldApplyFilter) {
      const query = buildTimeboxQuery();
      if (query) {
        blockedFetchUrl += `&query=${encodeURIComponent(query)}`;
      }
    }
    const url = startIndex ? `${blockedFetchUrl}&start=${startIndex}` : blockedFetchUrl;
    try {
      if (startIndex) {
        isLoadingMore = true;
        renderShowMoreButton(true);
      }
      const fetchResponse = await fetch(url);
      const dataResults = await fetchResponse.json();
      if (shouldApplyFilter) {
        dataResults.QueryResult.Results = filterByTimebox(dataResults.QueryResult.Results);
      }
      if (!startIndex) {
        totalResultCount = shouldApplyFilter ? dataResults.QueryResult.Results.length : dataResults.QueryResult.TotalResultCount;
        allBlockedItems = [];
      }
      allBlockedItems = allBlockedItems.concat(dataResults.QueryResult.Results);
      renderWidget(dataResults.QueryResult, startIndex);
      isLoadingMore = false;
    } catch (error) {
      console.error("Failed to fetch blocked items:", error);
      isLoadingMore = false;
      renderErrorState(error);
    }
  };
  var renderErrorState = (error) => {
    const collection = document.querySelector(".itemViewerCollection");
    collection.innerHTML = `<div class="blankSlate error">
        Unable to load blocked items. Please try refreshing the page.
    </div>`;
  };
  var buildTimeboxQuery = () => {
    return null;
  };
  var filterByTimebox = (blockers) => {
    const viewFilter = $RallyContext.ViewFilter;
    return blockers.filter((blocker) => {
      const workProduct = blocker.WorkProduct;
      if (!workProduct) {
        return false;
      }
      if (viewFilter.Type === "Iteration") {
        return workProduct.Iteration && workProduct.Iteration.Name === viewFilter.Value.Name;
      } else if (viewFilter.Type === "Release") {
        return workProduct.Release && workProduct.Release.Name === viewFilter.Value.Name;
      } else if (viewFilter.Type === "Milestone") {
        if (!workProduct.Milestones || workProduct.Milestones.Count === 0) {
          return false;
        }
        return workProduct.Milestones._tagsNameArray && workProduct.Milestones._tagsNameArray.some(
          (milestone) => milestone._ref === viewFilter.Value._ref
        );
      }
      return true;
    });
  };
  var renderWidget = (queryResult, startIndex) => {
    const collection = document.querySelector(".itemViewerCollection");
    if (allBlockedItems.length > 0) {
      const itemsHtml = allBlockedItems.map((record) => {
        const formattedRecord = { ...record };
        formattedRecord.CreationDate = formatDateWithConfiguration(record.CreationDate);
        return blockedItemTemplate(formattedRecord);
      }).join("");
      collection.innerHTML = itemsHtml;
      renderPagingBar(queryResult, startIndex);
      renderShowMoreButton(false, queryResult);
    } else {
      collection.innerHTML = '<div class="blankSlate">There are no items to display.</div>';
      document.querySelector(".itemViewerPaging").innerHTML = "";
      document.querySelector(".itemViewerShowMore").innerHTML = "";
    }
  };
  var formatDateWithConfiguration = (date) => {
    const usersDateFormat = $RallyContext.GlobalScope.Workspace.WorkspaceConfiguration.DateFormat;
    const tempDate = new Date(date);
    const month = String(tempDate.getMonth() + 1).padStart(2, "0");
    const day = String(tempDate.getDate()).padStart(2, "0");
    const year = tempDate.getFullYear();
    return usersDateFormat.replace(/MM/, month).replace(/yyyy/, year).replace(/dd/, day);
  };
  var applyFormattedIDTemplate = (record) => {
    return `<a href="${$RallyContext.Url.origin}/#/${$RallyContext.GlobalScope.Project.ObjectID}d?detail=/${record._type}/${record.ObjectID}/details" target="_blank">${record.FormattedID}</a>: ${escapeHtml(record.Name)}`;
  };
  var applyUserAvatarTemplate = (record, disabledClass, disabledTitle) => {
    return `<img alt="User Profile Avatar" src="/slm/profile/image/${record.ObjectID}/55.sp" class="itemViewer-avatar ${disabledClass}" ${disabledTitle}>`;
  };
  var applyRevisionTemplate = (record, disabledClass, disabledTitle) => {
    return `<div class="itemViewer-detail ${disabledClass}" ${disabledTitle}>\u{1F5D3}\uFE0F ${escapeHtml(record.CreationDate)} by ${escapeHtml(record.BlockedBy._refObjectName)} (${escapeHtml(record.BlockedBy.EmailAddress)}) in ${escapeHtml(record.WorkProduct.Project.Name)}</div>`;
  };
  var applyContentTemplate = (content) => {
    return content && content.length > 0 ? `<div class="itemViewer-content">\u{1F6D1} ${escapeHtml(content)}</div>` : "";
  };
  var blockedItemTemplate = (record) => {
    const disabledClass = record.BlockedBy.Disabled ? "itemViewer-user-disabled" : "";
    const disabledTitle = record.BlockedBy.Disabled ? ' title="User is Disabled"' : "";
    return `<div class="itemViewer">
        <div class="itemViewer-itemLink">${applyFormattedIDTemplate(record.WorkProduct)}</div>
        <div class="itemViewer-splitContainer">
            <div class="itemViewer-imgContainer">${applyUserAvatarTemplate(record.BlockedBy, disabledClass, disabledTitle)}</div>
            <div class="itemViewer-detailContainer">${applyRevisionTemplate(record, disabledClass, disabledTitle)}${applyContentTemplate(record.WorkProduct.BlockedReason)}</div>
        </div>
    </div>`;
  };
  var renderPagingBar = (queryResult, startIndex) => {
    const displayedItems = allBlockedItems.length;
    const settings = $RallyContext.Settings || defaultSettings;
    const isFollowingViewFilter = !settings.ignoreViewFilter && $RallyContext.ViewFilter && $RallyContext.ViewFilter.Type && $RallyContext.ViewFilter.Value;
    let countText;
    if (totalResultCount > displayedItems) {
      countText = `${displayedItems} of ${totalResultCount} items`;
    } else {
      countText = `${displayedItems} items`;
    }
    if (isFollowingViewFilter) {
      const timeboxName = $RallyContext.ViewFilter.Value.Name || $RallyContext.ViewFilter.Type;
      countText += ` in ${escapeHtml(timeboxName)}`;
    }
    document.querySelector(".itemViewerPaging").innerHTML = `<div class="itemViewerTotalResults">
        <div></div>
        <div></div>
        <div>${countText}</div>
    </div>`;
  };
  var renderShowMoreButton = (isLoading, queryResult) => {
    const showMoreContainer = document.querySelector(".itemViewerShowMore");
    if (!showMoreContainer) return;
    const displayedItems = allBlockedItems.length;
    const hasMore = displayedItems < totalResultCount;
    if (isLoading) {
      showMoreContainer.innerHTML = `<div class="itemViewer-showMoreContainer">
            <span class="itemViewer-showMore loading">Loading...</span>
        </div>`;
    } else if (hasMore && queryResult) {
      const nextStartIndex = queryResult.StartIndex + queryResult.PageSize;
      showMoreContainer.innerHTML = `<div class="itemViewer-showMoreContainer">
            <span tabindex="0" class="itemViewer-showMore" data-start-index="${nextStartIndex}">Show 200 More</span>
        </div>`;
      const showMoreBtn = showMoreContainer.querySelector(".itemViewer-showMore");
      if (showMoreBtn) {
        showMoreBtn.addEventListener("click", () => {
          fetchItems(nextStartIndex);
        });
        showMoreBtn.addEventListener("keypress", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            fetchItems(nextStartIndex);
          }
        });
      }
    } else {
      showMoreContainer.innerHTML = "";
    }
  };
  main();
})();

</script>
